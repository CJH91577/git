[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agent"
version = "0.1.0"
description = "企业级 AI 智能体平台：多格式文档 RAG + 多智能体协作 + MCP 工具调用 + 事实核查 + 人工审批(HITL)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CJH91577" }]
keywords = ["rag", "multi-agent", "mcp", "hitl", "llm", "enterprise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "openai>=1.30",
    "mcp>=1.9",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "fpdf2>=2.7",
    "chromadb>=0.5",
    "fastembed>=0.4",
    "jieba>=0.42",
    "rank-bm25>=0.2.2",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
